<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário</title>
</head>
<body>

  <div id="leadFormMount"></div>

  <script>
  (() => {
    // ✅ TROQUE AQUI pela URL do Webhook do n8n:
    const WEBHOOK_URL = "https://webhook.dosanjosdigital.com/webhook/form-blogger";

    const mount = document.getElementById("leadFormMount");
    if (!mount) return;

    const shadow = mount.attachShadow({ mode: "open" });

    // CSS + HTML isolados (Blogger não interfere)
    shadow.innerHTML = `
      <style>
        :host { all: initial; }
        *, *::before, *::after { box-sizing: border-box; }
        .wrap { font-family: Arial, Helvetica, sans-serif; }
        .card {
          max-width: 520px;
          width: 100%;
          margin: 0 auto;
          padding: 18px;
          border: 1px solid #e8e8e8;
          border-radius: 14px;
          background: #fff;
          box-shadow: 0 6px 18px rgba(0,0,0,.06);
        }
        h3 { margin: 0 0 12px; font-size: 18px; line-height: 1.2; }
        .grid { display: grid; gap: 12px; }
        label { display:block; font-size: 12px; color: #333; margin-bottom: 6px; }
        input, textarea, button {
          font: inherit;
          line-height: 1.2;
          -webkit-appearance: none;
          appearance: none;
        }
        input, textarea {
          width: 100%;
          padding: 12px;
          border-radius: 12px;
          border: 1px solid #dcdcdc;
          outline: none;
          font-size: 14px;
          background: #fff;
          color: #111;
        }
        input:focus, textarea:focus { border-color: #888; }
        textarea { min-height: 90px; resize: vertical; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 520px){ .row { grid-template-columns: 1fr; } }
        button {
          width: 100%;
          padding: 12px 14px;
          border: 0;
          border-radius: 12px;
          font-size: 15px;
          cursor: pointer;
          background: #111;
          color: #fff;
        }
        button:disabled { opacity: .6; cursor: not-allowed; }
        .msg {
          margin-top: 10px;
          font-size: 13px;
          padding: 10px;
          border-radius: 12px;
          display: none;
        }
        .ok { background: #e9f8ee; color: #1b6b2a; border: 1px solid #bfe8c9; }
        .err { background: #fff0f0; color: #9b1c1c; border: 1px solid #f5c2c2; }
        .hint { font-size: 12px; color: #666; margin-top: 6px; }
      </style>

      <div class="wrap">
        <div class="card">
          <h3>Fale com a gente</h3>

          <form id="leadForm" class="grid" autocomplete="on">
            <div>
              <label for="nome">Nome *</label>
              <input id="nome" name="nome" type="text" placeholder="Seu nome" required />
            </div>

            <div class="row">
              <div>
                <label for="email">E-mail *</label>
                <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" required />
              </div>

              <div>
                <label for="telefone">Telefone (WhatsApp) *</label>
                <input id="telefone" name="telefone" type="tel" placeholder="(11) 99999-9999" required />
                <div class="hint">Dica: coloque com DDD 🙂</div>
              </div>
            </div>

            <div>
              <label for="assunto">Assunto *</label>
              <input id="assunto" name="assunto" type="text" placeholder="Ex: Orçamento / Dúvida / Parceria" required />
            </div>

            <button id="btnEnviar" type="submit">Enviar</button>

            <div id="msgOk" class="msg ok">✅ Enviado! Em breve vamos te chamar no WhatsApp.</div>
            <div id="msgErr" class="msg err">❌ Não foi possível enviar. Tente novamente.</div>
          </form>
        </div>
      </div>
    `;

    const form = shadow.getElementById("leadForm");
    const btn = shadow.getElementById("btnEnviar");
    const msgOk = shadow.getElementById("msgOk");
    const msgErr = shadow.getElementById("msgErr");
    const tel = shadow.getElementById("telefone");

    const show = (el) => (el.style.display = "block");
    const hide = (el) => (el.style.display = "none");

    // Máscara simples de telefone BR (DDD + 8/9 dígitos)
    tel.addEventListener("input", () => {
      let v = tel.value.replace(/\D/g, "").slice(0, 11);
      if (v.length >= 2) v = "(" + v.slice(0, 2) + ") " + v.slice(2);
      if (v.length >= 10) v = v.replace(/(\)\s\d{4,5})(\d{4})$/, "$1-$2");
      tel.value = v;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hide(msgOk); hide(msgErr);

      btn.disabled = true;
      btn.textContent = "Enviando...";

      const data = {
        nome: form.nome.value.trim(),
        email: form.email.value.trim(),
        telefone: form.telefone.value.trim(),
        assunto: form.assunto.value.trim(),
        origem: "githubpages_iframe",
        userAgent: navigator.userAgent,
        pagina: document.referrer || document.location.href,
        timestamp: new Date().toISOString()
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        show(msgOk);
        form.reset();
      } catch (err) {
        console.error(err);
        show(msgErr);
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar";
      }
    });
  })();
  </script>

</body>
</html>
